<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="lril-kicad-skills: KiCad 10 agent skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a1e"/>
      <stop offset="1" stop-color="#1b4332"/>
    </linearGradient>
    <linearGradient id="cu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0b84a"/>
      <stop offset="1" stop-color="#f6d77a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- copper traces -->
  <g fill="none" stroke="url(#cu)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M40 260 H180 L230 210 H330"/>
    <path d="M40 220 H150 L200 170 H330"/>
    <path d="M40 180 H120 L170 130 H330"/>
    <path d="M40 140 H90 L140 90 H330"/>
    <path d="M870 60 H1000 L1050 110 H1160"/>
    <path d="M870 100 H980 L1030 150 H1160"/>
    <path d="M870 140 H960 L1010 190 H1160"/>
    <path d="M870 180 H940 L990 230 H1160"/>
  </g>
  <!-- vias / pads -->
  <g fill="#f6d77a" stroke="#0f2a1e" stroke-width="3">
    <circle cx="40" cy="260" r="9"/><circle cx="40" cy="220" r="9"/><circle cx="40" cy="180" r="9"/><circle cx="40" cy="140" r="9"/>
    <circle cx="1160" cy="110" r="9"/><circle cx="1160" cy="150" r="9"/><circle cx="1160" cy="190" r="9"/><circle cx="1160" cy="230" r="9"/>
  </g>

  <!-- chip -->
  <g>
    <rect x="345" y="70" width="510" height="180" rx="10" fill="#132f22" stroke="#f6d77a" stroke-width="4"/>
    <circle cx="372" cy="97" r="7" fill="#f6d77a"/>
    <g fill="#f6d77a">
      <rect x="330" y="86" width="16" height="10"/><rect x="330" y="126" width="16" height="10"/>
      <rect x="330" y="166" width="16" height="10"/><rect x="330" y="206" width="16" height="10"/>
      <rect x="854" y="86" width="16" height="10"/><rect x="854" y="126" width="16" height="10"/>
      <rect x="854" y="166" width="16" height="10"/><rect x="854" y="206" width="16" height="10"/>
    </g>
    <text x="600" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f6f1e1" letter-spacing="1">lril-kicad-skills</text>
    <text x="600" y="182" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#cfe3d5">KiCad 10 agent skills - interview first, verify everything</text>
    <text x="600" y="222" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#f6d77a">schematics - PCBs - symbols - footprints - fab exports</text>
  </g>

  <text x="600" y="296" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9bb8a6">ERC - DRC - netlist == spec - rendered and reviewed before you see it</text>
</svg>
